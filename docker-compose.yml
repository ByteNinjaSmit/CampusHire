# CampusHire dev stack. No source bind mounts: images are self-contained (see PLAN.md section 10).
name: campushire

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: campushire
      POSTGRES_USER: campushire
      POSTGRES_PASSWORD: campushire
    ports:
      - "5433:5432" # host 5432 is usually taken by a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campushire -d campushire"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # pgsty/minio is the maintained community fork (upstream minio/minio images are no longer published).
  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: campushire
      MINIO_ROOT_PASSWORD: campushire-secret
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:3000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    # No healthcheck: the api entrypoint waits for MinIO via boto3 (app.core.wait).
    restart: unless-stopped

  mailpit:
    image: axllent/mailpit:v1
    ports:
      - "1025:1025" # SMTP
      - "8025:8025" # web UI
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    image: campushire-backend:dev
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
      mailpit:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s # migrations + seed run before uvicorn starts
    restart: unless-stopped

  # Celery worker with the embedded beat scheduler (-B). Same image as api.
  worker:
    build:
      context: ./backend
    image: campushire-backend:dev
    env_file: .env
    environment:
      RUN_MIGRATIONS: "false"
      SEED_DEMO: "false"
    command: ["celery", "-A", "app.workers.main", "worker", "-B", "-l", "info", "--concurrency", "2"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "celery -A app.workers.main inspect ping -d celery@$$HOSTNAME -t 5 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_WS_URL: ws://localhost:8000
    image: campushire-frontend:dev
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.status<500?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
